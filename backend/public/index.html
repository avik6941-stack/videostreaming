<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | Video Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; font-family: "DM Sans", sans-serif; --muted: #9ca5b5; --line: #28303c; --accent: #ff4d6d; --accent-2: #ff8a5b; }
    body { max-width: 520px; min-height: 100vh; margin: 0 auto; padding: 0 20px 48px; background: radial-gradient(circle at 10% 0%, #242238 0, transparent 32%), #0b0e13; color: #f7f8fa; }
    .site-header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; padding: 22px 0; background: rgba(11, 14, 19, .86); backdrop-filter: blur(18px); }
    .brand { color: #f7f8fa; font: 700 1.2rem "Space Grotesk", sans-serif; text-decoration: none; letter-spacing: -.04em; }
    .brand::before { display: inline-block; width: 10px; height: 10px; margin: 0 8px 1px 0; border-radius: 50%; background: var(--accent); content: ""; box-shadow: 0 0 18px rgba(255, 77, 109, .7); }
    .menu-button { width: 44px; height: 40px; padding: 8px; border: 1px solid #3a4352; border-radius: 8px; background: #151a23; }
    .menu-icon, .menu-icon::before, .menu-icon::after { display: block; height: 2px; border-radius: 2px; background: #fff; content: ""; }
    .menu-icon::before { transform: translateY(-7px); }
    .menu-icon::after { transform: translateY(5px); }
    .auth-nav { position: absolute; top: 70px; right: 0; display: none; flex-direction: column; min-width: 150px; padding: 8px; border: 1px solid var(--line); border-radius: 12px; background: #171d27; box-shadow: 0 18px 50px rgba(0,0,0,.35); }
    .auth-nav.open { display: flex; }
    .auth-nav a { padding: 10px 12px; border-radius: 7px; text-decoration: none; }
    .auth-nav a:hover { background: #252e3d; }
    main { padding-top: 12vh; }
    h1 { margin-bottom: 8px; font: 700 2.5rem "Space Grotesk", sans-serif; letter-spacing: -.06em; }
    h1::before { display: inline-block; width: 12px; height: 12px; margin: 0 10px 3px 0; border-radius: 50%; background: var(--accent); content: ""; box-shadow: 0 0 18px rgba(255, 77, 109, .7); }
    body > p { color: var(--muted); }
    form { margin-top: 28px; padding: 28px; border: 1px solid var(--line); border-radius: 16px; background: #151a23; box-shadow: 0 24px 70px rgba(0,0,0,.2); }
    label { display: block; margin: 14px 0 6px; color: var(--muted); }
    input, select, button { box-sizing: border-box; width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #3a4352; font: inherit; }
    input, select { background: #0e1219; color: #fff; }
    select { background: #111318; color: #fff; }
    .phone { display: grid; grid-template-columns: 1fr 1.25fr; gap: 8px; }
    button { margin-top: 20px; border: 0; background: linear-gradient(100deg, var(--accent), var(--accent-2)); color: #fff; cursor: pointer; font-weight: 700; }
    #status { min-height: 24px; margin-top: 16px; color: #a8e6c2; }
    .error { color: #ff9d9d !important; }
    a { color: #ff9aae; }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Video Platform</a>
    <button id="menu-button" class="menu-button" type="button" aria-label="Open menu" aria-expanded="false"><span class="menu-icon"></span></button>
    <nav id="auth-nav" class="auth-nav" aria-label="Main navigation"><a href="/">Home</a><a href="/login">Login</a><a href="/register">Register</a></nav>
  </header>
  <main>
    <h1>Create account</h1>
    <p>Register with your email and password.</p>
  <form id="register-form">
    <label for="name">Name</label>
    <input id="name" name="name" required>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" minlength="6" required>
    <label for="date-of-birth">Date of birth</label>
    <input id="date-of-birth" name="dateOfBirth" type="date" required>
    <label for="sex">Sex</label>
    <select id="sex" name="sex" required>
      <option value="">Select</option>
      <option value="male">Male</option>
      <option value="female">Female</option>
      <option value="other">Other</option>
      <option value="prefer_not_to_say">Prefer not to say</option>
    </select>
    <button type="submit">Create account</button>
    <div id="status" role="status"></div>
  </form>
    <p>Already registered? <a href="/login">Login</a></p>
  </main>
  <script>
    const menuButton = document.querySelector("#menu-button");
    const authNav = document.querySelector("#auth-nav");
    menuButton.addEventListener("click", () => {
      const open = authNav.classList.toggle("open");
      menuButton.setAttribute("aria-expanded", String(open));
    });
    const form = document.querySelector("#register-form");
    const status = document.querySelector("#status");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.className = "";
      status.textContent = "Creating account...";
      try {
        const values = Object.fromEntries(new FormData(form));
        const response = await fetch("/api/auth/register", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(values) });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Registration failed");
        window.location.href = "/login?registered=1";
      } catch (error) { status.className = "error"; status.textContent = error.message; }
    });
  </script>
</body>
</html>
